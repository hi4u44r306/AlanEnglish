<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 6000" role="img" aria-labelledby="title desc">
  <title id="title">童話冒險關卡地圖</title>
  <desc id="desc">從草原、森林、雪山到火山城堡的輕量向量冒險地圖。</desc>
  <defs>
